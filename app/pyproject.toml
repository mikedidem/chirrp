    "psycopg[binary]>=3.2.0",
    "torch>=2.2.0",
    "flopy>=3.9.3",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "langchain>=0.3.27",
    "langchain-google-genai>=2.1.9",
    "langgraph>=0.6.3",
    "beautifulsoup4>=4.12.3",
