<header class="topbar">
  <div class="topbar-inner">
    <a routerLink="/" class="brand">
      <span class="brand-mark">CHIRRP</span>
      <span class="brand-sub">Hydro-AI Participatory Planning</span>
    </a>
    <nav class="nav-links">
      @for (link of links; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: link.exact }"
          [title]="link.desc"
        >{{ link.label }}</a>
      }
    </nav>
  </div>
</header>
